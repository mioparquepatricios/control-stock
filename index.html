<style>
  :root{
    --verde:#1b5e20; --verde-claro:#2e7d32; --azul:#0d47a1; --rojo:#b71c1c;
    --bg:#111827; --panel:#1f2937; --texto:#f3f4f6; --sub:#9ca3af; --borde:#374151;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:90px;}
  header{padding:16px 16px 8px;text-align:center;}
  header h1{margin:0;font-size:1.3rem;}
  header p{margin:4px 0 0;color:var(--sub);font-size:.85rem;}
  .contador{background:var(--panel);margin:12px;border-radius:14px;padding:14px 8px;display:flex;justify-content:space-around;gap:6px;text-align:center;}
  .contador div{flex:1;min-width:0;}
  .contador div span{display:block;font-size:1.25rem;font-weight:700;word-break:break-all;}
  .contador div small{color:var(--sub);font-size:.72rem;}
  .camara{position:relative;width:100%;max-width:480px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;display:none;}
  .camara.activa{display:block;}
  #video{width:100%;display:block;}
  #reader{width:100%;}
  .mira{position:absolute;left:6%;right:6%;top:50%;height:20%;transform:translateY(-50%);border:3px solid #66bb6a;border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.22);pointer-events:none;display:none;}
  .camara.activa .mira{display:block;}
  #diag{text-align:center;color:#6b7280;font-size:.72rem;margin:2px 12px;min-height:1em;}
  .botones{display:flex;gap:10px;padding:0 12px;margin:12px 0;flex-wrap:wrap;}
  button{border:none;border-radius:12px;padding:14px 16px;font-size:1rem;font-weight:600;color:white;flex:1;min-width:120px;cursor:pointer;}
  .btn-verde{background:var(--verde-claro);}
  .btn-azul{background:var(--azul);}
  .btn-rojo{background:var(--rojo);}
  .btn-gris{background:#374151;}
  button:active{filter:brightness(0.85);}
  button:disabled{opacity:.5;}
  .manual{display:flex;gap:8px;padding:0 12px;margin:12px 0;}
  .manual input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--borde);background:var(--panel);color:var(--texto);font-size:1rem;}
  .lista{padding:0 12px;}
  .item{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:8px;}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .item-desc-art{font-weight:700;font-size:1.05rem;line-height:1.2;}
  .item-desc-art.sindato{color:#f0a020;}
  .item-atributos{color:var(--texto);font-size:.9rem;margin-top:3px;}
  .item-atributos b{color:#66bb6a;}
  .item-precio{color:#66bb6a;font-weight:700;}
  .item-codigo{font-weight:700;font-size:1.05rem;word-break:break-all;}
  .item-fecha{color:var(--sub);font-size:.72rem;margin-top:3px;word-break:break-all;}
  .item-desc{width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--borde);background:#111827;color:var(--texto);font-size:.9rem;}
  .item-acciones{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .stepper{display:flex;align-items:center;gap:6px;}
  .stepper button{flex:none;width:36px;height:36px;padding:0;font-size:1.2rem;border-radius:8px;background:#374151;}
  .stepper span{min-width:32px;text-align:center;font-weight:700;font-size:1.1rem;}
  .borrar{background:transparent;color:#ef5350;flex:none;padding:8px;font-weight:700;}
  .vacio{text-align:center;color:var(--sub);padding:30px 16px;}
  #estado{text-align:center;color:var(--sub);font-size:.85rem;margin:8px 12px;min-height:1.2em;}
  #ultimo{text-align:center;color:#66bb6a;font-size:.95rem;font-weight:700;margin:0 12px 6px;min-height:1.2em;}
  .barra-fija{position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:10px 12px 14px;border-top:1px solid var(--borde);display:flex;gap:10px;}
  .pie{text-align:center;color:#4b5563;font-size:.7rem;margin:14px 0 4px;}

<body>

<header>
  <h1>📦 Control de Stock</h1>
  <p>Escaneá la etiqueta: te muestra artículo, color, talle y precio. Después exportás a Excel.</p>
</header>

<div class="contador">
  <div><span id="totalCodigos">0</span><small>artículos distintos</small></div>
  <div><span id="totalUnidades">0</span><small>unidades totales</small></div>
  <div><span id="totalValor">$0</span><small>valor de venta</small></div>
</div>

<div class="camara" id="camara">
  <video id="video" playsinline muted></video>
  <div id="reader"></div>
  <div class="mira"></div>
</div>

<div id="ultimo"></div>
<div id="estado"></div>
<div id="diag"></div>

<div class="botones">
  <button class="btn-verde" id="btnEscanear">▶ Iniciar cámara</button>
  <button class="btn-gris" id="btnDetener" style="display:none;">■ Detener</button>
  <button class="btn-gris" id="btnLuz" style="display:none;">🔦 Luz</button>
  <button class="btn-gris" id="btnCam" style="display:none;">📷 Otra cámara</button>
  <button class="btn-gris" id="btnModo" style="display:none;">🔄 Otro modo</button>
</div>

<div class="manual">
  <input type="text" id="inputManual" placeholder="O escribí el código a mano" inputmode="numeric">
  <button class="btn-azul" id="btnAgregarManual" style="flex:none;">Agregar</button>
</div>

<div class="lista" id="lista"></div>

<div class="pie">versión 8 · recuerda la cámara</div>

<div class="barra-fija">
  <button class="btn-azul" id="btnExportar">⬇ Exportar a Excel</button>
  <button class="btn-rojo" id="btnVaciar">🗑 Vaciar todo</button>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="articulos.js"></script>
<script>
const CLAVE = "controlStockCodigos_v1";
let datos = JSON.parse(localStorage.getItem(CLAVE) || "{}");
let ultimoCodigo = null;
let ultimoTiempo = 0;

// ---- estado de la cámara ----
let stream = null;       // MediaStream activo
let track = null;        // pista de video (para la linterna)
let loopId = null;       // setInterval del detector nativo
let detector = null;     // BarcodeDetector nativo
let scannerLib = null;   // fallback html5-qrcode
let luzEncendida = false;
let modoActual = "nativo";   // "nativo" | "respaldo"
let intentos = 0;            // frames analizados por el lector nativo
let detecciones = 0;         // frames en que encontró un código
let ultimoError = "";        // último error de detección
let resVideo = "";           // resolución del video
let camaras = [];            // cámaras de video disponibles
let camIdx = 0;              // cuál se está usando
let camPref = "";            // deviceId de la cámara que funcionó antes
let cicladoManual = false;   // el usuario está probando cámaras con el botón
try{ camPref = localStorage.getItem("camStockPref") || ""; }catch(e){}

const $ = id => document.getElementById(id);

function guardar(){ localStorage.setItem(CLAVE, JSON.stringify(datos)); }

// ---- catálogo de artículos (viene de articulos.js) ----
const ARTICULOS = new Map();
(function(){
  const raw = window.ARTICULOS_DATA || {};
  for(const k in raw) ARTICULOS.set(String(k).toUpperCase(), raw[k]);
})();
const HAY_CATALOGO = ARTICULOS.size > 0;

// El código de barra viene: ARTICULO % COLOR(2) TALLE
function buscarArticulo(codigoCompleto){
  const cod = (codigoCompleto || "").trim();
  let articulo = cod, color = "", talle = "";
  const i = cod.indexOf("%");
  if(i > 0){
    articulo = cod.slice(0, i);
    const resto = cod.slice(i + 1);
    color = resto.slice(0, 2);
    talle = resto.slice(2);
  }
  const info = ARTICULOS.get(articulo.toUpperCase());
  return {
    articulo: articulo,
    color: color.toUpperCase(),
    talle: talle.toUpperCase(),
    desc: info ? (info[0] || "") : "",
    precio: (info && info[1] != null) ? info[1] : null
  };
}

function formatoPrecio(n){
  if(n === null || n === undefined || n === "" || isNaN(n)) return "";
  return "$" + Number(n).toLocaleString("es-AR");
}

// completa artículo/color/talle/precio en registros viejos
function asegurarDatos(codigo){
  const it = datos[codigo];
  if(it && it.articulo === undefined){
    const a = buscarArticulo(codigo);
    it.articulo = a.articulo; it.color = a.color; it.talle = a.talle;
    it.desc = a.desc; it.precio = a.precio;
  }
}

function formatoFecha(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit"});
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  }catch(e){}
}

function agregarCodigo(codigo, desdeCamara){
  codigo = (codigo || "").trim();
  if(!codigo) return;
  const ahora = new Date().toISOString();
  if(datos[codigo]){
    datos[codigo].cantidad += 1;
    datos[codigo].ultima = ahora;
    asegurarDatos(codigo);
  } else {
    const a = buscarArticulo(codigo);
    datos[codigo] = {
      cantidad: 1, descripcion: "", primera: ahora, ultima: ahora,
      articulo: a.articulo, color: a.color, talle: a.talle, desc: a.desc, precio: a.precio
    };
  }
  guardar();
  renderLista();
  if(navigator.vibrate) navigator.vibrate(80);
  beep();
  if(desdeCamara){
    const it = datos[codigo];
    let txt = it.desc || ("Artículo " + it.articulo + " (no está en la lista)");
    const extra = [it.color && ("color " + it.color), it.talle && ("talle " + it.talle), formatoPrecio(it.precio)].filter(Boolean).join(" · ");
    $("ultimo").textContent = "✓ " + txt + (extra ? "  —  " + extra : "") + "   (x" + it.cantidad + ")";
  }
}

function cambiarCantidad(codigo, delta){
  if(!datos[codigo]) return;
  datos[codigo].cantidad += delta;
  if(datos[codigo].cantidad <= 0) delete datos[codigo];
  guardar();
  renderLista();
}

function cambiarDescripcion(codigo, valor){
  if(!datos[codigo]) return;
  datos[codigo].descripcion = valor;
  guardar();
}

function borrarCodigo(codigo){
  delete datos[codigo];
  guardar();
  renderLista();
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderLista(){
  const lista = $("lista");
  const claves = Object.keys(datos).sort((a,b) => new Date(datos[b].ultima) - new Date(datos[a].ultima));

  let totalUnidades = 0, totalValor = 0;
  claves.forEach(c => {
    asegurarDatos(c);
    totalUnidades += datos[c].cantidad;
    if(datos[c].precio != null) totalValor += datos[c].precio * datos[c].cantidad;
  });
  $("totalCodigos").textContent = claves.length;
  $("totalUnidades").textContent = totalUnidades;
  $("totalValor").textContent = totalValor ? formatoPrecio(totalValor) : "$0";

  if(claves.length === 0){
    lista.innerHTML = '<div class="vacio">Todavía no escaneaste ningún código</div>';
    return;
  }

  lista.innerHTML = claves.map(codigo => {
    const item = datos[codigo];
    const hayDesc = !!item.desc;
    const titulo = hayDesc ? esc(item.desc) : ("Artículo " + esc(item.articulo || codigo) + " — no está en la lista");
    const attrs = [];
    if(item.articulo) attrs.push("Art. " + esc(item.articulo));
    if(item.color) attrs.push("color <b>" + esc(item.color) + "</b>");
    if(item.talle) attrs.push("talle <b>" + esc(item.talle) + "</b>");
    const precio = formatoPrecio(item.precio);
    return `
    <div class="item">
      <div class="item-top">
        <div>
          <div class="item-desc-art ${hayDesc ? "" : "sindato"}">${titulo}</div>
          <div class="item-atributos">${attrs.join(" · ")}${precio ? ' · <span class="item-precio">' + precio + '</span>' : ""}</div>
          <div class="item-fecha">${esc(codigo)} · ${formatoFecha(item.ultima)}</div>
        </div>
        <button class="borrar" onclick="borrarCodigo('${esc(codigo)}')">✕</button>
      </div>
      <input class="item-desc" placeholder="Nota (opcional)" value="${esc(item.descripcion)}" onchange="cambiarDescripcion('${esc(codigo)}', this.value)">
      <div class="item-acciones">
        <div class="stepper">
          <button onclick="cambiarCantidad('${esc(codigo)}', -1)">−</button>
          <span>${item.cantidad}</span>
          <button onclick="cambiarCantidad('${esc(codigo)}', 1)">+</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function alDetectar(codigoTexto){
  const ahora = Date.now();
  if(codigoTexto === ultimoCodigo && (ahora - ultimoTiempo) < 1800) return;
  ultimoCodigo = codigoTexto;
  ultimoTiempo = ahora;
  agregarCodigo(codigoTexto, true);
}

// ---------- INICIAR / DETENER CÁMARA ----------

const FORMATOS = ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code","data_matrix"];
const hayNativo = ("BarcodeDetector" in window);
const _cv = document.createElement("canvas");
const _ctx = _cv.getContext("2d", { willReadFrequently: true });

function pintarDiag(){
  let t = "";
  if(modoActual === "nativo"){
    t = "lector nativo" + (resVideo ? " · " + resVideo : "") + " · " + intentos + " lecturas";
    if(camaras.length > 1) t += " · cám " + (camIdx + 1) + "/" + camaras.length;
    if(detecciones) t += " · " + detecciones + " detectadas";
    if(camPref && camaras[camIdx] && camaras[camIdx].deviceId === camPref) t += " · ✓ recordada";
    if(ultimoError) t += " · error: " + ultimoError;
    if(intentos > 60 && detecciones === 0 && camaras.length > 1){
      $("estado").textContent = "Esta cámara no engancha. Tocá 📷 Otra cámara y volvé a probar.";
    }
  } else {
    t = "modo respaldo" + (hayNativo ? "" : " (este navegador no tiene lector nativo)");
  }
  $("diag").textContent = t;
}

function puntajeCam(d){
  const l = (d.label || "").toLowerCase();
  let p = 0;
  if(/back|tras|rear|environment|posterior/.test(l)) p += 5;
  if(/wide|ang|0\.5|ultra/.test(l)) p -= 4;
  if(/tele|zoom|depth|profund|mono/.test(l)) p -= 3;
  return p;
}

async function enumerarCamaras(){
  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    const vids = devs.filter(d => d.kind === "videoinput");
    vids.sort((a,b) => puntajeCam(b) - puntajeCam(a));
    camaras = vids;
    // si hay una cámara guardada de antes, arrancar por esa
    if(camPref && !cicladoManual){
      const k = camaras.findIndex(c => c.deviceId === camPref);
      if(k >= 0) camIdx = k;
    }
    if(camIdx > camaras.length - 1) camIdx = 0;
  }catch(e){ camaras = []; }
}

async function abrirStream(deviceId){
  const res = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  const v = deviceId ? Object.assign({ deviceId: { exact: deviceId } }, res)
                     : Object.assign({ facingMode: { ideal: "environment" } }, res);
  return navigator.mediaDevices.getUserMedia({ video: v, audio: false });
}

async function prender(video, deviceId){
  stream = await abrirStream(deviceId);
  video.srcObject = stream;
  await video.play();
  track = stream.getVideoTracks()[0];
  try{ await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); }catch(e){}
}

async function arrancarNativo(){
  detector = new window.BarcodeDetector();
  const video = $("video");

  // si ya hay permiso, listamos primero para poder elegir la cámara guardada
  await enumerarCamaras();
  let deviceId = (camaras.length && camaras[camIdx] && camaras[camIdx].deviceId) ? camaras[camIdx].deviceId : null;
  await prender(video, deviceId);

  if(camaras.length === 0 || !deviceId){
    // recién ahora hay etiquetas / deviceIds
    await enumerarCamaras();
    const idPref = (camaras.length && camaras[camIdx] && camaras[camIdx].deviceId) ? camaras[camIdx].deviceId : null;
    const idActual = (track && track.getSettings) ? track.getSettings().deviceId : null;
    if(idPref && idPref !== idActual){
      stream.getTracks().forEach(t => t.stop());
      await prender(video, idPref);
    }
  }

  loopId = setInterval(async () => {
    if(video.readyState < 2 || !video.videoWidth) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if(!resVideo) resVideo = vw + "x" + vh;
    intentos++;
    if(intentos % 5 === 0) pintarDiag();
    try{
      // franja central ampliada (donde está el recuadro verde)
      const bandH = Math.max(2, Math.round(vh * 0.55));
      const y0 = Math.round((vh - bandH) / 2);
      const esc = vw < 1000 ? 2 : 1;
      _cv.width = vw * esc; _cv.height = bandH * esc;
      _ctx.drawImage(video, 0, y0, vw, bandH, 0, 0, _cv.width, _cv.height);
      let codigos = await detector.detect(_cv);
      if((!codigos || !codigos.length) && intentos % 4 === 0){
        codigos = await detector.detect(video); // de vez en cuando, el cuadro completo
      }
      if(codigos && codigos.length){
        detecciones++;
        // recordar esta cámara: es la que funciona
        const id = camaras[camIdx] && camaras[camIdx].deviceId;
        if(id && id !== camPref){
          camPref = id;
          try{ localStorage.setItem("camStockPref", id); }catch(e){}
        }
        alDetectar(codigos[0].rawValue);
      }
    }catch(e){
      ultimoError = (e && e.name) || "?";
      pintarDiag();
    }
  }, 130);
}

async function iniciarCamara(modo){
  modoActual = modo || (hayNativo ? "nativo" : "respaldo");
  intentos = 0; detecciones = 0; ultimoError = ""; resVideo = "";
  $("estado").textContent = "Iniciando cámara...";
  $("btnEscanear").disabled = true;
  $("camara").classList.add("activa"); // el <video> debe estar visible para decodificar
  pintarDiag();

  if(modoActual === "nativo"){
    try{
      await arrancarNativo();
      mostrarCamaraActiva("Apuntá al código de barra");
      return;
    }catch(err){
      await pararTodo();
      if(err && (err.name === "NotAllowedError" || err.name === "NotFoundError" || err.name === "SecurityError")){
        $("camara").classList.remove("activa");
        $("diag").textContent = "";
        $("estado").textContent = "No se pudo abrir la cámara. Tocá el candado 🔒 al lado de la dirección → Permisos → Cámara: Permitir, y recargá.";
        $("btnEscanear").disabled = false;
        return;
      }
      modoActual = "respaldo"; // otro error: paso al respaldo
      pintarDiag();
    }
  }

  // ---- MODO RESPALDO: librería html5-qrcode ----
  try{
    scannerLib = new Html5Qrcode("reader", {
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    await scannerLib.start(
      { facingMode: "environment" },
      { fps: 20, qrbox: (w,h) => { const an = Math.floor(Math.min(w,h)*0.92); return { width:an, height:Math.floor(an*0.42) }; } },
      alDetectar,
      () => {}
    );
    mostrarCamaraActiva("Apuntá al código de barra");
  }catch(err){
    await pararTodo();
    $("camara").classList.remove("activa");
    $("diag").textContent = "";
    $("estado").textContent = "No se pudo abrir la cámara. Revisá los permisos de la cámara para esta página.";
    $("btnEscanear").disabled = false;
  }
}

function mostrarCamaraActiva(msg){
  $("camara").classList.add("activa");
  $("estado").textContent = msg;
  $("btnEscanear").style.display = "none";
  $("btnEscanear").disabled = false;
  $("btnDetener").style.display = "block";
  $("btnModo").style.display = "block";
  $("btnModo").textContent = modoActual === "nativo" ? "🔄 Probar otro modo" : "🔄 Volver al modo normal";
  $("btnCam").style.display = (modoActual === "nativo" && camaras.length > 1) ? "block" : "none";
  if(track && track.getCapabilities && track.getCapabilities().torch){
    $("btnLuz").style.display = "block";
  }
  pintarDiag();
}

async function pararTodo(){
  if(loopId){ clearInterval(loopId); loopId = null; }
  detector = null;
  if(scannerLib){
    try{ await scannerLib.stop(); scannerLib.clear(); }catch(e){}
    scannerLib = null;
  }
  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  track = null;
  luzEncendida = false;
  const v = $("video");
  if(v) v.srcObject = null;
}

async function detenerCamara(){
  await pararTodo();
  $("camara").classList.remove("activa");
  $("estado").textContent = "";
  $("diag").textContent = "";
  $("btnEscanear").style.display = "block";
  $("btnEscanear").disabled = false;
  $("btnDetener").style.display = "none";
  $("btnLuz").style.display = "none";
  $("btnModo").style.display = "none";
  $("btnCam").style.display = "none";
}

async function cambiarModo(){
  const nuevo = modoActual === "nativo" ? "respaldo" : "nativo";
  await pararTodo();
  await iniciarCamara(nuevo);
}

async function cambiarCamara(){
  if(camaras.length < 2) return;
  camIdx = (camIdx + 1) % camaras.length;
  cicladoManual = true;
  await pararTodo();
  await iniciarCamara("nativo");
  cicladoManual = false;
}

async function toggleLuz(){
  if(!track) return;
  try{
    luzEncendida = !luzEncendida;
    await track.applyConstraints({ advanced: [{ torch: luzEncendida }] });
    $("btnLuz").textContent = luzEncendida ? "🔦 Apagar" : "🔦 Luz";
  }catch(e){}
}

$("btnEscanear").addEventListener("click", () => iniciarCamara());
$("btnDetener").addEventListener("click", detenerCamara);
$("btnLuz").addEventListener("click", toggleLuz);
$("btnModo").addEventListener("click", cambiarModo);
$("btnCam").addEventListener("click", cambiarCamara);
$("video").addEventListener("click", async () => {
  if(!track) return;
  try{
    await track.applyConstraints({ advanced: [{ focusMode: "single-shot" }] });
    setTimeout(() => { if(track){ try{ track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); }catch(e){} } }, 1500);
  }catch(e){}
});

$("btnAgregarManual").addEventListener("click", () => {
  const input = $("inputManual");
  agregarCodigo(input.value);
  input.value = "";
});
$("inputManual").addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    agregarCodigo(e.target.value);
    e.target.value = "";
  }
});

$("btnVaciar").addEventListener("click", () => {
  if(Object.keys(datos).length === 0) return;
  if(confirm("¿Borrar todos los códigos escaneados? No se puede deshacer.")){
    datos = {};
    guardar();
    renderLista();
  }
});

$("btnExportar").addEventListener("click", () => {
  const claves = Object.keys(datos);
  if(claves.length === 0){
    alert("Todavía no hay códigos para exportar.");
    return;
  }
  const filas = claves.map(codigo => {
    const it = datos[codigo];
    asegurarDatos(codigo);
    const precio = (it.precio != null) ? it.precio : "";
    const subtotal = (it.precio != null) ? it.precio * it.cantidad : "";
    return {
      "Artículo": it.articulo || "",
      "Descripción": it.desc || "",
      "Color": it.color || "",
      "Talle": it.talle || "",
      "Precio venta": precio,
      "Cantidad": it.cantidad,
      "Subtotal": subtotal,
      "Nota": it.descripcion || "",
      "Código de barra": codigo,
      "Primera lectura": formatoFecha(it.primera),
      "Última lectura": formatoFecha(it.ultima)
    };
  });
  const hoja = XLSX.utils.json_to_sheet(filas);
  hoja["!cols"] = [{wch:12},{wch:30},{wch:8},{wch:8},{wch:12},{wch:9},{wch:12},{wch:20},{wch:20},{wch:17},{wch:17}];
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Stock");
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(libro, `control_stock_${fecha}.xlsx`);
});

renderLista();
if(!HAY_CATALOGO){
  $("estado").textContent = "⚠ No se pudo cargar la lista de artículos (articulos.js). Se escanea igual, pero sin descripción ni precio.";
}
</script>
</body>
</html>
