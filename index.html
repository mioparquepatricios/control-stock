<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Control de Stock</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b5e20">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Control%20de%20Stock%22,%22short_name%22:%22Stock%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23111827%22,%22theme_color%22:%22%231b5e20%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%253Csvg xmlns=%2527http://www.w3.org/2000/svg%2527 viewBox=%25270 0 100 100%2527%253E%253Crect width=%2527100%2527 height=%2527100%2527 rx=%252718%2527 fill=%2527%25231b5e20%2527/%253E%253Crect x=%252718%2527 y=%252728%2527 width=%25278%2527 height=%252744%2527 fill=%2527white%2527/%253E%253Crect x=%252730%2527 y=%252728%2527 width=%25274%2527 height=%252744%2527 fill=%2527white%2527/%253E%253Crect x=%252738%2527 y=%252728%2527 width=%252710%2527 height=%252744%2527 fill=%2527white%2527/%253E%253Crect x=%252752%2527 y=%252728%2527 width=%25274%2527 height=%252744%2527 fill=%2527white%2527/%253E%253Crect x=%252760%2527 y=%252728%2527 width=%25278%2527 height=%252744%2527 fill=%2527white%2527/%253E%253Crect x=%252772%2527 y=%252728%2527 width=%25276%2527 height=%252744%2527 fill=%2527white%2527/%253E%253C/svg%253E%22,%22sizes%22:%22any%22,%22type%22:%22image/svg+xml%22}]}">
<style>
  :root{
    --verde:#1b5e20; --verde-claro:#2e7d32; --azul:#0d47a1; --rojo:#b71c1c;
    --bg:#111827; --panel:#1f2937; --texto:#f3f4f6; --sub:#9ca3af; --borde:#374151;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:90px;}
  header{padding:16px 16px 8px;text-align:center;}
  header h1{margin:0;font-size:1.3rem;}
  header p{margin:4px 0 0;color:var(--sub);font-size:.85rem;}
  .contador{background:var(--panel);margin:12px;border-radius:14px;padding:14px;display:flex;justify-content:space-around;text-align:center;}
  .contador div span{display:block;font-size:1.6rem;font-weight:700;}
  .contador div small{color:var(--sub);}
  .camara{position:relative;width:100%;max-width:480px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;display:none;}
  .camara.activa{display:block;}
  #video{width:100%;display:block;}
  #reader{width:100%;}
  .mira{position:absolute;left:8%;right:8%;top:50%;height:32%;transform:translateY(-50%);border:3px solid #66bb6a;border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none;display:none;}
  .camara.activa .mira{display:block;}
  .botones{display:flex;gap:10px;padding:0 12px;margin:12px 0;flex-wrap:wrap;}
  button{border:none;border-radius:12px;padding:14px 16px;font-size:1rem;font-weight:600;color:white;flex:1;min-width:120px;cursor:pointer;}
  .btn-verde{background:var(--verde-claro);}
  .btn-azul{background:var(--azul);}
  .btn-rojo{background:var(--rojo);}
  .btn-gris{background:#374151;}
  button:active{filter:brightness(0.85);}
  button:disabled{opacity:.5;}
  .manual{display:flex;gap:8px;padding:0 12px;margin:12px 0;}
  .manual input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--borde);background:var(--panel);color:var(--texto);font-size:1rem;}
  .lista{padding:0 12px;}
  .item{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:8px;}
  .item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .item-codigo{font-weight:700;font-size:1.05rem;word-break:break-all;}
  .item-fecha{color:var(--sub);font-size:.75rem;margin-top:2px;}
  .item-desc{width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--borde);background:#111827;color:var(--texto);font-size:.9rem;}
  .item-acciones{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .stepper{display:flex;align-items:center;gap:6px;}
  .stepper button{flex:none;width:36px;height:36px;padding:0;font-size:1.2rem;border-radius:8px;background:#374151;}
  .stepper span{min-width:32px;text-align:center;font-weight:700;font-size:1.1rem;}
  .borrar{background:transparent;color:#ef5350;flex:none;padding:8px;font-weight:700;}
  .vacio{text-align:center;color:var(--sub);padding:30px 16px;}
  #estado{text-align:center;color:var(--sub);font-size:.85rem;margin:8px 12px;min-height:1.2em;}
  #ultimo{text-align:center;color:#66bb6a;font-size:.95rem;font-weight:700;margin:0 12px 6px;min-height:1.2em;}
  .barra-fija{position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:10px 12px 14px;border-top:1px solid var(--borde);display:flex;gap:10px;}
  .pie{text-align:center;color:#4b5563;font-size:.7rem;margin:14px 0 4px;}
</style>
</head>
<body>

<header>
  <h1>📦 Control de Stock</h1>
  <p>Escaneá los códigos de barra y después exportá todo a Excel</p>
</header>

<div class="contador">
  <div><span id="totalCodigos">0</span><small>códigos distintos</small></div>
  <div><span id="totalUnidades">0</span><small>unidades totales</small></div>
</div>

<div class="camara" id="camara">
  <video id="video" playsinline muted></video>
  <div id="reader"></div>
  <div class="mira"></div>
</div>

<div id="ultimo"></div>
<div id="estado"></div>

<div class="botones">
  <button class="btn-verde" id="btnEscanear">▶ Iniciar cámara</button>
  <button class="btn-gris" id="btnDetener" style="display:none;">■ Detener</button>
  <button class="btn-gris" id="btnLuz" style="display:none;">🔦 Luz</button>
</div>

<div class="manual">
  <input type="text" id="inputManual" placeholder="O escribí el código a mano" inputmode="numeric">
  <button class="btn-azul" id="btnAgregarManual" style="flex:none;">Agregar</button>
</div>

<div class="lista" id="lista"></div>

<div class="pie">versión 4 · lector nativo</div>

<div class="barra-fija">
  <button class="btn-azul" id="btnExportar">⬇ Exportar a Excel</button>
  <button class="btn-rojo" id="btnVaciar">🗑 Vaciar todo</button>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script>
const CLAVE = "controlStockCodigos_v1";
let datos = JSON.parse(localStorage.getItem(CLAVE) || "{}");
let ultimoCodigo = null;
let ultimoTiempo = 0;

// ---- estado de la cámara ----
let stream = null;       // MediaStream activo
let track = null;        // pista de video (para la linterna)
let loopId = null;       // setInterval del detector nativo
let detector = null;     // BarcodeDetector nativo
let scannerLib = null;   // fallback html5-qrcode
let luzEncendida = false;

const $ = id => document.getElementById(id);

function guardar(){ localStorage.setItem(CLAVE, JSON.stringify(datos)); }

function formatoFecha(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit"});
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  }catch(e){}
}

function agregarCodigo(codigo, desdeCamara){
  codigo = (codigo || "").trim();
  if(!codigo) return;
  const ahora = new Date().toISOString();
  if(datos[codigo]){
    datos[codigo].cantidad += 1;
    datos[codigo].ultima = ahora;
  } else {
    datos[codigo] = { cantidad: 1, descripcion: "", primera: ahora, ultima: ahora };
  }
  guardar();
  renderLista();
  if(navigator.vibrate) navigator.vibrate(80);
  beep();
  if(desdeCamara){
    $("ultimo").textContent = "✓ " + codigo + "  (x" + datos[codigo].cantidad + ")";
  }
}

function cambiarCantidad(codigo, delta){
  if(!datos[codigo]) return;
  datos[codigo].cantidad += delta;
  if(datos[codigo].cantidad <= 0) delete datos[codigo];
  guardar();
  renderLista();
}

function cambiarDescripcion(codigo, valor){
  if(!datos[codigo]) return;
  datos[codigo].descripcion = valor;
  guardar();
}

function borrarCodigo(codigo){
  delete datos[codigo];
  guardar();
  renderLista();
}

function renderLista(){
  const lista = $("lista");
  const claves = Object.keys(datos).sort((a,b) => new Date(datos[b].ultima) - new Date(datos[a].ultima));

  let totalUnidades = 0;
  claves.forEach(c => totalUnidades += datos[c].cantidad);
  $("totalCodigos").textContent = claves.length;
  $("totalUnidades").textContent = totalUnidades;

  if(claves.length === 0){
    lista.innerHTML = '<div class="vacio">Todavía no escaneaste ningún código</div>';
    return;
  }

  lista.innerHTML = claves.map(codigo => {
    const item = datos[codigo];
    return `
    <div class="item">
      <div class="item-top">
        <div>
          <div class="item-codigo">${codigo}</div>
          <div class="item-fecha">Última lectura: ${formatoFecha(item.ultima)}</div>
        </div>
        <button class="borrar" onclick="borrarCodigo('${codigo}')">✕</button>
      </div>
      <input class="item-desc" placeholder="Descripción (opcional)" value="${item.descripcion.replace(/"/g,'&quot;')}" onchange="cambiarDescripcion('${codigo}', this.value)">
      <div class="item-acciones">
        <div class="stepper">
          <button onclick="cambiarCantidad('${codigo}', -1)">−</button>
          <span>${item.cantidad}</span>
          <button onclick="cambiarCantidad('${codigo}', 1)">+</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function alDetectar(codigoTexto){
  const ahora = Date.now();
  if(codigoTexto === ultimoCodigo && (ahora - ultimoTiempo) < 1800) return;
  ultimoCodigo = codigoTexto;
  ultimoTiempo = ahora;
  agregarCodigo(codigoTexto, true);
}

// ---------- INICIAR / DETENER CÁMARA ----------

const FORMATOS = ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","codabar","qr_code"];

async function iniciarCamara(){
  $("estado").textContent = "Iniciando cámara...";
  $("btnEscanear").disabled = true;
  $("camara").classList.add("activa"); // el <video> debe estar visible para decodificar

  // 1) Intento con el lector NATIVO del navegador (mejor en Android)
  if("BarcodeDetector" in window){
    try{
      let formatos = FORMATOS;
      try{
        const soportados = await window.BarcodeDetector.getSupportedFormats();
        formatos = FORMATOS.filter(f => soportados.includes(f));
      }catch(e){}
      detector = new window.BarcodeDetector({ formats: formatos.length ? formatos : undefined });

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      const video = $("video");
      video.srcObject = stream;
      await video.play();
      track = stream.getVideoTracks()[0];

      loopId = setInterval(async () => {
        if(video.readyState < 2) return;
        try{
          const codigos = await detector.detect(video);
          if(codigos && codigos.length){
            alDetectar(codigos[0].rawValue);
          }
        }catch(e){}
      }, 180);

      mostrarCamaraActiva("Apuntá al código de barra");
      return;
    }catch(err){
      await pararTodo();
      if(err && (err.name === "NotAllowedError" || err.name === "NotFoundError")){
        $("camara").classList.remove("activa");
        $("estado").textContent = "No se pudo abrir la cámara. Tocá el candado 🔒 al lado de la dirección y permití la Cámara para esta página.";
        $("btnEscanear").disabled = false;
        return;
      }
      // si falló por otra razón, sigo al fallback
    }
  }

  // 2) Fallback: librería html5-qrcode
  try{
    const mapa = {
      ean_13:"EAN_13", ean_8:"EAN_8", upc_a:"UPC_A", upc_e:"UPC_E",
      code_128:"CODE_128", code_39:"CODE_39", itf:"ITF", codabar:"CODABAR", qr_code:"QR_CODE"
    };
    const fmts = FORMATOS.map(f => Html5QrcodeSupportedFormats[mapa[f]]).filter(x => x !== undefined);
    scannerLib = new Html5Qrcode("reader", {
      formatsToSupport: fmts,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    await scannerLib.start(
      { facingMode: "environment" },
      { fps: 15, qrbox: (w,h) => { const l = Math.floor(Math.min(w,h)*0.9); return { width:l, height:Math.floor(l*0.55) }; } },
      alDetectar,
      () => {}
    );
    mostrarCamaraActiva("Apuntá al código de barra");
  }catch(err){
    await pararTodo();
    $("camara").classList.remove("activa");
    $("estado").textContent = "No se pudo abrir la cámara. Revisá los permisos de la cámara para esta página.";
    $("btnEscanear").disabled = false;
  }
}

function mostrarCamaraActiva(msg){
  $("camara").classList.add("activa");
  $("estado").textContent = msg;
  $("btnEscanear").style.display = "none";
  $("btnEscanear").disabled = false;
  $("btnDetener").style.display = "block";
  if(track && track.getCapabilities && track.getCapabilities().torch){
    $("btnLuz").style.display = "block";
  }
}

async function pararTodo(){
  if(loopId){ clearInterval(loopId); loopId = null; }
  detector = null;
  if(scannerLib){
    try{ await scannerLib.stop(); scannerLib.clear(); }catch(e){}
    scannerLib = null;
  }
  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  track = null;
  luzEncendida = false;
  const v = $("video");
  if(v) v.srcObject = null;
}

async function detenerCamara(){
  await pararTodo();
  $("camara").classList.remove("activa");
  $("estado").textContent = "";
  $("btnEscanear").style.display = "block";
  $("btnEscanear").disabled = false;
  $("btnDetener").style.display = "none";
  $("btnLuz").style.display = "none";
}

async function toggleLuz(){
  if(!track) return;
  try{
    luzEncendida = !luzEncendida;
    await track.applyConstraints({ advanced: [{ torch: luzEncendida }] });
    $("btnLuz").textContent = luzEncendida ? "🔦 Apagar" : "🔦 Luz";
  }catch(e){}
}

$("btnEscanear").addEventListener("click", iniciarCamara);
$("btnDetener").addEventListener("click", detenerCamara);
$("btnLuz").addEventListener("click", toggleLuz);

$("btnAgregarManual").addEventListener("click", () => {
  const input = $("inputManual");
  agregarCodigo(input.value);
  input.value = "";
});
$("inputManual").addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    agregarCodigo(e.target.value);
    e.target.value = "";
  }
});

$("btnVaciar").addEventListener("click", () => {
  if(Object.keys(datos).length === 0) return;
  if(confirm("¿Borrar todos los códigos escaneados? No se puede deshacer.")){
    datos = {};
    guardar();
    renderLista();
  }
});

$("btnExportar").addEventListener("click", () => {
  const claves = Object.keys(datos);
  if(claves.length === 0){
    alert("Todavía no hay códigos para exportar.");
    return;
  }
  const filas = claves.map(codigo => ({
    "Código": codigo,
    "Descripción": datos[codigo].descripcion || "",
    "Cantidad": datos[codigo].cantidad,
    "Primera lectura": formatoFecha(datos[codigo].primera),
    "Última lectura": formatoFecha(datos[codigo].ultima)
  }));
  const hoja = XLSX.utils.json_to_sheet(filas);
  hoja["!cols"] = [{wch:18},{wch:28},{wch:10},{wch:18},{wch:18}];
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Stock");
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(libro, `control_stock_${fecha}.xlsx`);
});

renderLista();
</script>
</body>
</html>
